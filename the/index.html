<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE World University Rankings</title>
    <link rel="canonical" href="https://researchplymouth.com">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://datatables.net">
    <link rel="stylesheet" href="/static/css/basic.css?v=202611090007">
    <link rel="stylesheet" href="/static/css/the_datatables.css?v=202611090007">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://datatables.net">
    <link rel="stylesheet" href="https://datatables.net">
    <meta name="description" content="Explore the World University Rankings—Times Higher Education (THE)—with Searchable Insights.">
    <meta name="keywords" content="Times Higher Education (THE) World University Rankings.">
</head>
<body>
    <header class="brandingheader">
        <img src="/static/svg/RP-Logo.svg" alt="Research Plymouth Logo" class="brandinglogo">
        <a class="rp-banner rp-title-black em150" href="https://researchplymouth.com">Research Plymouth</a>
    </header>
    
    <section style="max-width: 95vw; margin: auto; padding-top: 20px;">
        <h1 id="pageTitle"></h1>
        <h6 id="introduction"></h6>
        
        <!-- Enhanced Interactive Dynamic Year Selector Control Framework Container -->
        <div class="d-flex align-items-center mb-4 gap-2 col-md-4 col-sm-6 col-12">
            <label for="yearSelector" class="form-label fw-bold text-nowrap mb-0">Select Ranking Year:</label>
            <select id="yearSelector" class="form-select" disabled>
                <option value="">Scanning files...</option>
            </select>
        </div>

        <div id="dataTableWrapper" class="table-responsive text-left" style="position: relative;">
            <div id="spinner" class="spinner-border spinner text-primary" style="display: none; position: absolute; top: 50%; left: 50%; z-index: 1000;"></div>
            <table id="dataTable" class="table table-striped table-bordered dataTable">
                <thead>
                    <tr>
                        <th title="#">#</th>
                        <th title="THE World University Rankings">Rank</th>
                        <th title="Institution">Institution</th>
                        <th title="Country Code">Code</th>
                        <th title="Country">Country</th>
                        <th title="Overall Score">Overall</th>
                        <th title="Teaching (the Learning Environment)">Teaching</th>
                        <th title="Research Environment">Research <br/> Environment</th>
                        <th title="Research Quality">Research <br/> Quality</th>
                        <th title="Industry">Industry</th>
                        <th title="International Outlook">International <br/> Outlook</th>
                        <th title="Calculated Total Score - 29.5% from Teaching, 29% from Research Environment, 30% from Research Quality, 4% from Industry, and 7.5% from International Outlook">Calculated</th>
                        <th title="National/Regional Rank based on Calculated Total Score per Country">National <br/> Rank</th>
                    </tr>
                </thead>
            </table>
        </div>        
        <div id="citation" class="citation-section mt-4"></div>
    </section>

    <footer>
        <p>&copy; 2025 Research Plymouth. All rights reserved.</p>
    </footer>

<script src="https://jquery.com"></script>
<script src="https://datatables.net"></script>
<script src="https://cloudflare.com"></script>
<script>
    const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
</script>
<script type="text/javascript" src="/static/js/load_the.js?v=202611090007" crossorigin="anonymous"></script>
</body>
</html>
